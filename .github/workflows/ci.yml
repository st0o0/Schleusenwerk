name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ./src/global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ hashFiles('src/Directory.Packages.props', 'src/**/packages.lock.json') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore ./src/Schleusenwerk.slnx

      - name: Build
        run: dotnet build --configuration Release --no-restore ./src/Schleusenwerk.slnx

      - name: Test
        working-directory: ./src
        run: >
          dotnet test
          --configuration Release
          --no-ansi
          --no-build
          --coverage
          --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/testresults
          --project ./Schleusenwerk.Tests/Schleusenwerk.Tests.csproj

  typescript:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/Schleusenwerk.Web/package-lock.json

      - name: Install & type-check
        working-directory: src/Schleusenwerk.Web
        run: |
          npm ci
          npx vue-tsc --noEmit
